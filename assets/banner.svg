<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0b112c" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowLeft" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowRight" cx="85%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Isometric Grid Pattern -->
    <pattern id="isoGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 30 L 60 60 Z" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45" />
      <path d="M 0 0 L 60 30 L 0 60 Z" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.45" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .banner-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .banner-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 500;
      fill: #94a3b8;
    }
    .banner-pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
    }
    .floating-iso-wire {
      animation: floatIso 6s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .pulse-glow {
      animation: pulseAnim 4s ease-in-out infinite alternate;
    }
    .mesh-node {
      animation: nodePulse 3s ease-in-out infinite alternate;
    }
    @keyframes floatIso {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-12px) rotate(1.5deg); }
    }
    @keyframes pulseAnim {
      0% { opacity: 0.3; }
      100% { opacity: 0.7; }
    }
    @keyframes nodePulse {
      0% { r: 3.5px; opacity: 0.6; }
      100% { r: 5.5px; opacity: 1; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#isoGrid)" />

  <!-- Dynamic Ambient Glowing Orbs -->
  <circle cx="200" cy="120" r="280" fill="url(#glowLeft)" class="pulse-glow" />
  <circle cx="1020" cy="280" r="320" fill="url(#glowRight)" class="pulse-glow" style="animation-delay: -2s;" />

  <!-- Isometric Wireframe Architecture Visuals in Background Right -->
  <g class="floating-iso-wire" opacity="0.65">
    <!-- Isometric Tower 1 -->
    <path d="M 980 140 L 1050 100 L 1120 140 L 1050 180 Z" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.8" fill-opacity="0.7"/>
    <path d="M 980 140 L 980 290 L 1050 330 L 1050 180 Z" fill="#0f172a" stroke="#4f46e5" stroke-width="1.8" fill-opacity="0.8"/>
    <path d="M 1050 180 L 1050 330 L 1120 290 L 1120 140 Z" fill="#1e293b" stroke="#6366f1" stroke-width="1.8" fill-opacity="0.8"/>
    <!-- Wire lines on Tower 1 -->
    <line x1="980" y1="190" x2="1050" y2="230" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="980" y1="240" x2="1050" y2="280" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="1050" y1="230" x2="1120" y2="190" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="1050" y1="280" x2="1120" y2="240" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Isometric Tower 2 (Cyan) -->
    <path d="M 870 190 L 930 155 L 990 190 L 930 225 Z" fill="#082f49" stroke="#0ea5e9" stroke-width="1.6" fill-opacity="0.7"/>
    <path d="M 870 190 L 870 320 L 930 355 L 930 225 Z" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.6" fill-opacity="0.8"/>
    <path d="M 930 225 L 930 355 L 990 320 L 990 190 Z" fill="#075985" stroke="#38bdf8" stroke-width="1.6" fill-opacity="0.8"/>

    <!-- Isometric Data Cube / Geospatial Tile -->
    <path d="M 1070 240 L 1115 215 L 1160 240 L 1115 265 Z" fill="#14532d" stroke="#10b981" stroke-width="1.4" fill-opacity="0.75"/>
    <path d="M 1070 240 L 1070 320 L 1115 345 L 1115 265 Z" fill="#064e3b" stroke="#059669" stroke-width="1.4" fill-opacity="0.85"/>
    <path d="M 1115 265 L 1115 345 L 1160 320 L 1160 240 Z" fill="#047857" stroke="#34d399" stroke-width="1.4" fill-opacity="0.85"/>

    <!-- Mesh Lattice / Constellation Nodes -->
    <line x1="930" y1="155" x2="980" y2="140" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="1050" y1="100" x2="1115" y2="215" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="990" y1="225" x2="1070" y2="240" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3,3"/>

    <circle cx="930" cy="155" r="4.5" fill="#38bdf8" class="mesh-node"/>
    <circle cx="1050" cy="100" r="5" fill="#c084fc" class="mesh-node"/>
    <circle cx="980" cy="140" r="4" fill="#818cf8" class="mesh-node"/>
    <circle cx="1115" cy="215" r="4.5" fill="#34d399" class="mesh-node"/>
  </g>

  <!-- Foreground Title and Content Section (Protected clear bounds) -->
  <g transform="translate(80, 0)">
    <!-- Top Category Badge -->
    <g transform="translate(0, 68)">
      <rect width="280" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9" />
      <circle cx="15" cy="15" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED DEVELOPER ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="152" class="banner-title">
      3D Data Visualization <tspan fill="url(#primaryGrad)">&amp;</tspan>
    </text>
    <text x="0" y="206" class="banner-title" fill="url(#primaryGrad)">
      Architectural Rendering
    </text>

    <!-- Subtitle -->
    <text x="0" y="252" class="banner-subtitle">
      Geospatial 3D Tiles • WebGL/WebGPU Data Engines • Real-Time BIM &amp; Path Tracing
    </text>

    <!-- Feature Tags / Quick Indicator Pills -->
    <g transform="translate(0, 288)">
      <!-- Pill 1: WebGL/WebGPU -->
      <g transform="translate(0, 0)">
        <rect width="138" height="34" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
        <text x="69" y="22" text-anchor="middle" class="banner-pill-text" fill="#7dd3fc">⚡ WebGL / WebGPU</text>
      </g>
      <!-- Pill 2: 3D Tiles & GIS -->
      <g transform="translate(148, 0)">
        <rect width="148" height="34" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
        <text x="74" y="22" text-anchor="middle" class="banner-pill-text" fill="#a5b4fc">🌐 3D Tiles &amp; GIS</text>
      </g>
      <!-- Pill 3: BIM / IFC -->
      <g transform="translate(306, 0)">
        <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.2" opacity="0.9" />
        <text x="65" y="22" text-anchor="middle" class="banner-pill-text" fill="#6ee7b7">🏛️ BIM &amp; IFC</text>
      </g>
      <!-- Pill 4: Path Tracing & AI -->
      <g transform="translate(446, 0)">
        <rect width="168" height="34" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
        <text x="84" y="22" text-anchor="middle" class="banner-pill-text" fill="#e9d5ff">✨ Real-Time Ray Tracing</text>
      </g>
    </g>

    <!-- Bottom Footer Metric Note -->
    <text x="2" y="362" font-family="-apple-system, sans-serif" font-size="12" font-weight="500" fill="#64748b">
      Verified SaaS Pricing &amp; Tier Limits • Open-Source Repos Ranked by GitHub Stars ⭐ • Updated 2026
    </text>
  </g>
</svg>
